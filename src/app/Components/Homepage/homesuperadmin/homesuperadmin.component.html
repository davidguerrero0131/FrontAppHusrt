<div class="dashboard-container">

  <div class="hero-section">
    <div class="hero-content">
      <h1>Panel de {{ isSuperadmin ? 'Super Administrador' : 'Inicio' }}</h1>
      <p>{{ isSuperadmin ? 'Gestión global del sistema, personalización y configuración avanzada.' : 'Seleccione un módulo para continuar' }}</p>
    </div>
  </div>

  <div class="cards-grid">

    <!-- Tarjetas Dinámicas desde Backend -->
    <a *ngFor="let mod of modulos" class="dashboard-card nav-link-container" [routerLink]="[mod.ruta]">
      <div class="card-icon-container gradient-blue">
        <i [ngClass]="getIconClass(mod.icono)"></i>
      </div>
      <div class="card-content">
        <h3>{{ mod.nombre }}</h3>
        <p>{{ mod.descripcion }}</p>
        <span class="card-action">Ingresar <i class="pi pi-arrow-right"></i></span>
      </div>
    </a>

  </div>
</div>
