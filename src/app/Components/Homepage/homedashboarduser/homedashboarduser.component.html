<div class="dashboard-container">
  <div class="hero-section" style="margin-bottom: 3rem;">
    <div class="hero-content">
      <h1>Mis Tableros PowerBI</h1>
      <p>Visualiza los tableros que tienes a cargo.</p>
    </div>
  </div>
  <div class="cards-grid" style="grid-template-columns: repeat(auto-fit, 384px); justify-content: center; gap: 3rem; margin-top: 2rem;">
    <a [routerLink]="['/dashboarduser/powerbi']" class="dashboard-card nav-link-container">
      <div class="card-icon-container gradient-green">
        <i class="pi pi-chart-line"></i>
      </div>
      <div class="card-content">
        <h3>Ver Tableros</h3>
        <p>Ingresa para visualizar tus métricas asignadas.</p>
        <span class="card-action">Acceder <i class="pi pi-arrow-right"></i></span>
      </div>
    </a>
  </div>
</div>
